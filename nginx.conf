server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # La build usa outputHashing: los assets con hash son inmutables.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca se cachea para que un despliegue nuevo se sirva al instante.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fallback SPA: las rutas de Angular (/home, /categorias, ...) resuelven
    # al index.html y el router decide.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Assets copiados tal cual desde src/assets (sin hash de contenido): cache
    # corto para que un despliegue nuevo llegue a los navegadores. Un año de
    # immutable aqui dejaria ficheros antiguos (p. ej. assets/js/main.js)
    # servidos desde cache tras cambiar la release.
    location ^~ /assets/ {
        expires 1h;
        try_files $uri =404;
    }

    # Artefactos de la build con hash de contenido (main-XXXXXXXX.js,
    # styles-XXXXXXXX.css): inmutables.
    location ~* "-[A-Za-z0-9]{6,}\.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp|avif)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Resto de estaticos sin hash (favicon, media suelta): cache corto y 404 si
    # no existen, en vez de devolver el index.html como fallback SPA.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp|avif|map|txt)$ {
        expires 1h;
        try_files $uri =404;
    }

    # index.html nunca se cachea para que un despliegue nuevo se sirva al instante.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fallback SPA: las rutas de Angular (/home, /categorias, ...) resuelven
    # al index.html y el router decide.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
